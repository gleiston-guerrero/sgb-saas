# EV-2 en CI: ejecuta `make verify` (scripts/verify-all.py) en clon
# limpio Linux con GNU Make real. Se dispara en push a cualquier rama y
# manual (workflow_dispatch). Sin secretos, sin credenciales personales,
# sin URLs privadas: P2 usa red publica (Zenodo), P10 levanta sus
# propios Testcontainers (postgres/redis) con Docker del runner, y el
# resto es estatico (git/python) o Maven Central. Si P10 no encuentra
# Docker, el orquestador lo marca PENDIENTE-bloqueado (visible, nunca
# exito); cualquier FALLO pone el job en rojo con codigo distinto de cero.
name: Verificar expediente (make verify)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: make verify (orquestador P1-P12)
        run: make verify
